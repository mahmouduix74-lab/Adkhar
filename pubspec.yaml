name: adhkar_app
description: "تطبيق سمت — مواقيت الصلاة واتجاهها، أذكار الصباح والمساء، والمصحف، ووردك اليومي من القرآن."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.3.2
  quran: ^1.3.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  adhan: ^2.0.0+1
  geolocator: ^14.0.3
  lucide_icons_flutter: ^3.1.18
  iconsax_plus: ^1.0.0
  hijri: ^3.0.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  http: ^1.6.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/corpus/
