name: Deploy web

# Builds the Flutter web version and publishes it to GitHub Pages
# (https://mahmouduix74-lab.github.io/Adkhar/) on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable

      - run: flutter pub get

      # quran 1.3.1 imports three translation files with different letter
      # case than the files it ships. macOS ignores case; Linux does not.
      - name: Work around quran package file name case on Linux
        run: |
          ROOT=$(python3 -c "import json; print(next(p['rootUri'] for p in json.load(open('.dart_tool/package_config.json'))['packages'] if p['name'] == 'quran').removeprefix('file://'))")
          cd "$ROOT/lib/translations"
          ln -sf en_clearquran.dart en_clearQuran.dart
          ln -sf fr_hamidullah.dart fr_Hamidullah.dart
          ln -sf fa_husseindari.dart fa_husseinDari.dart

      - run: flutter test

      - run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --base-href /Adkhar/

      - name: Drop debug symbols
        run: find build/web -name '*.symbols' -delete

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
